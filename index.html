<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anirudh | iOS 18 Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        :root {
            --ios-bg: #000;
            --glass: rgba(30, 30, 30, 0.7);
            --border: rgba(255, 255, 255, 0.15);
            --phone-w: 320px;
            --phone-h: 568px;
        }

        body {
            margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a1a2e, #050505);
            font-family: -apple-system, sans-serif; overflow: hidden; perspective: 1500px;
        }

        /* --- 3D HARDWARE --- */
        #phone-wrapper {
            width: var(--phone-w); height: var(--phone-h);
            position: relative; transform-style: preserve-3d;
            transform: rotateY(-90deg); opacity: 0;
        }

        #chassis {
            width: 100%; height: 100%; background: #111; border-radius: 44px;
            position: relative; border: 2px solid #222;
            box-shadow: 0 30px 100px rgba(0,0,0,0.9), inset 0 0 5px #333;
        }

        /* --- SCREEN --- */
        #bezel {
            position: absolute; top: 75px; left: 10px; right: 10px; bottom: 85px;
            background: #000; border-radius: 4px; overflow: hidden;
        }

        .wallpaper {
            position: absolute; inset: 0; 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            z-index: 1;
        }

        /* --- LAYERS --- */
        .layer { position: absolute; inset: 0; z-index: 5; display: none; }
        
        #lock-screen {
            display: flex; flex-direction: column; align-items: center; padding-top: 40px;
            color: white; background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); z-index: 20;
        }

        #home-screen {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
            padding: 25px 15px; z-index: 10;
        }

        /* --- UI ELEMENTS --- */
        .app-container { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        
        .app-icon {
            width: 52px; height: 52px; border-radius: 12px;
            background: var(--glass); border: 1px solid var(--border);
            backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: center;
            font-size: 20px; transition: transform 0.1s;
        }

        .app-label { color: white; font-size: 10px; margin-top: 5px; opacity: 0.8; }

        /* --- DOCK --- */
        .dock {
            position: absolute; bottom: 12px; left: 12px; right: 12px;
            height: 75px; background: rgba(255,255,255,0.1);
            backdrop-filter: blur(30px); border-radius: 26px;
            display: flex; justify-content: space-around; align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* --- APP VIEW (ZOOM EFFECT) --- */
        #app-view {
            position: absolute; inset: 0; background: #1c1c1e; z-index: 100;
            transform: scale(0); opacity: 0; border-radius: 4px;
            display: flex; flex-direction: column; color: white;
        }

        .app-header { padding: 40px 20px 10px; font-size: 24px; font-weight: 700; border-bottom: 1px solid #333; }
        .app-body { padding: 20px; font-size: 14px; opacity: 0.7; }

        /* --- PHYSICAL HOME BUTTON --- */
        #home-btn {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 54px; height: 54px; border-radius: 50%;
            border: 1px solid #333; background: #050505; cursor: pointer;
            z-index: 200; box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

<div id="phone-wrapper">
    <div id="chassis">
        <div style="position:absolute; top:35px; left:50%; transform:translateX(-50%); width:50px; height:5px; background:#000; border-radius:10px; box-shadow: 0 1px 0 #333;"></div>
        
        <div id="bezel">
            <div class="wallpaper"></div>

            <div id="lock-screen" class="layer" style="display:flex;">
                <div style="font-size: 52px; font-weight: 700;">21:45</div>
                <div style="font-size: 14px; opacity: 0.8;">Friday, April 10</div>
            </div>

            <div id="home-screen" class="layer">
                <div class="app-container" onclick="openApp('Projects', '#2d3436')">
                    <div class="app-icon" style="background: linear-gradient(135deg, #6c5ce7, #a29bfe);">📂</div>
                    <span class="app-label">Projects</span>
                </div>
                <div class="app-container" onclick="openApp('Experience', '#00b894')">
                    <div class="app-icon" style="background: linear-gradient(135deg, #00b894, #55efc4);">💼</div>
                    <span class="app-label">Work</span>
                </div>
                <div class="app-container" onclick="openApp('Design', '#d63031')">
                    <div class="app-icon" style="background: linear-gradient(135deg, #e17055, #fab1a0);">🎨</div>
                    <span class="app-label">Design</span>
                </div>
                <div class="app-container" onclick="openApp('Skills', '#0984e3')">
                    <div class="app-icon" style="background: linear-gradient(135deg, #0984e3, #74b9ff);">⚡</div>
                    <span class="app-label">Skills</span>
                </div>

                <div class="dock">
                    <div class="app-icon" onclick="openApp('Mail', '#111')">✉️</div>
                    <div class="app-icon" onclick="openApp('GitHub', '#000')">🐙</div>
                    <div class="app-icon" onclick="openApp('Settings', '#333')">⚙️</div>
                </div>
            </div>

            <div id="app-view">
                <div class="app-header" id="app-title">App Name</div>
                <div class="app-body">Loading modern interface...</div>
            </div>
        </div>

        <div id="home-btn" onclick="closeApp()"></div>
    </div>
</div>

<script>
    const tl = gsap.timeline();

    // 1. Turning Animation
    tl.to("#phone-wrapper", {
        rotateY: 0, opacity: 1, duration: 1.5, ease: "power4.out"
    });

    // 2. Auto Unlock (Swipe Up)
    tl.to("#lock-screen", {
        y: "-100%", duration: 1, ease: "expo.inOut", delay: 1,
        onStart: () => { document.getElementById('home-screen').style.display = 'grid'; }
    });

    // 3. App Open Logic (Zoom)
    function openApp(name, color) {
        document.getElementById('app-title').innerText = name;
        document.getElementById('app-view').style.background = color;
        
        gsap.to("#app-view", {
            scale: 1, opacity: 1, duration: 0.5, ease: "power3.out",
            pointerEvents: "all"
        });
    }

    // 4. Home Button Logic (Back to Home)
    function closeApp() {
        gsap.to("#app-view", {
            scale: 0, opacity: 0, duration: 0.4, ease: "power3.in",
            pointerEvents: "none"
        });
    }
</script>

</body>
</html>
